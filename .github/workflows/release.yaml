name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # id-token: write # uncomment after https://github.com/npm/cli/issues/8976 is fixed

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm run build

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required until https://github.com/npm/cli/issues/8976 is fixed and
          # trusted publish works with scoped packages
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
