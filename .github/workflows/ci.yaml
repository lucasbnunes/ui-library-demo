name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: node:24

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint .

  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: node:24

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:unit

  storybook-tests:
    runs-on: ubuntu-latest
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.61.0-noble

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:storybook

  format:
    runs-on: ubuntu-latest
    container:
      image: node:24

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run format .

  build:
    runs-on: ubuntu-latest
    container:
      image: node:24

    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
